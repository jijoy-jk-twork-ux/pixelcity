<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1a2b">
<title>PIXEL CITY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- AUTH -->
<section id="auth" class="screen hidden">
  <div class="panel auth-card">
    <h1 class="logo">PIXEL<br>CITY</h1>
    <p class="sub">Walk. Chat. Talk. <span class="ml">പിക്സൽ സിറ്റി</span></p>
    <div class="tabs"><button id="tabLogin" class="tab on">Log in</button><button id="tabReg" class="tab">Register</button></div>
    <form id="loginForm" autocomplete="on">
      <input id="liEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="liPass" type="password" placeholder="Password" autocomplete="current-password" required>
      <label class="chk"><input id="liStay" type="checkbox" checked> Stay logged in</label>
      <button class="btn gold" type="submit">Log in</button>
    </form>
    <form id="regForm" class="hidden" autocomplete="on">
      <input id="rgEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="rgName" type="text" placeholder="Username (3-16, a-z 0-9 _)" maxlength="16" autocomplete="username" required>
      <input id="rgPass" type="password" placeholder="Password (6+ characters)" minlength="6" autocomplete="new-password" required>
      <button class="btn gold" type="submit">Create account</button>
    </form>
    <p id="cfgWarn" class="warn hidden">Firebase is not configured yet. Open js/firebase-config.js and paste your project keys.</p>
  </div>
</section>

<!-- ROTATE -->
<section id="rotate" class="screen hidden black">
  <div class="phone"></div>
  <p class="px">ROTATE YOUR SCREEN</p>
  <p class="sub">Pixel City plays in landscape. <span class="ml">ഫോൺ തിരിക്കുക</span></p>
</section>

<!-- LOADING -->
<section id="loading" class="screen hidden">
  <h1 class="logo big">PIXEL<br>CITY</h1>
  <div class="bar"><i id="barFill"></i></div>
  <p id="tip" class="sub"></p>
</section>

<!-- START -->
<section id="start" class="screen hidden">
  <h1 class="logo big">PIXEL<br>CITY</h1>
  <button id="startBtn" class="btn gold huge">TAP TO START</button>
  <p class="sub">Goes fullscreen &middot; sound on</p>
</section>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <button id="btnMenu" class="ibtn" aria-label="Menu">&#9776;<b id="badge" class="badge hidden">0</b></button>
    <button id="userPill" class="pill"><span id="uName">player</span><span class="trophy">&#127942;</span><b id="uScore">0</b></button>
    <span class="grow"></span>
    <span id="online" class="pill soft">&#128101; 1</span>
    <button id="btnMic" class="ibtn" aria-label="Microphone">&#127908;</button>
    <button id="btnSet" class="ibtn" aria-label="Settings">&#9881;</button>
  </div>
  <div id="micTag" class="micTag hidden"></div>
  <div id="fps" class="fps hidden"></div>
  <div id="chatLog"></div>
  <div id="chatBar" class="hidden"><input id="chatIn" type="text" maxlength="80" placeholder="Say something (80 chars)" autocomplete="off"><button id="chatSend" class="btn gold sm">Send</button></div>
  <button id="exitBtn" class="btn red hidden">EXIT</button>
  <div id="interact" class="hint hidden"></div>
  <div id="joyZone"></div><div id="joyBase"><i id="joyKnob"></i></div>
  <div id="actPop" class="hidden"><button id="btnX" class="btn teal">X<small>Enter</small></button><button id="btnY" class="btn gold">Y<small>Chat</small></button></div>
  <button id="actBtn" aria-label="Jump / more">A</button>
</div>

<!-- MODALS -->
<div id="modal" class="hidden"><div class="panel box">
  <header><h2 id="mTitle"></h2><button id="mClose" class="ibtn sm">&times;</button></header>
  <div id="mBody"></div>
</div></div>

<div id="toasts"></div>
<div id="fade"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
